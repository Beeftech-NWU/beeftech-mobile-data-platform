org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8
android.useAndroidX=true


# Room 2.8's compiler needs a newer kotlinx-serialization than KSP1
# provides; under KSP1, reading the exported schema JSON fails with
# an AbstractMethodError. KSP2 runs it correctly.
ksp.useKSP2=true
